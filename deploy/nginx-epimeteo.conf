# nginx del juego Epimeteo. Fichero propio, exclusivo del subdominio del juego: NUNCA se toca
# /etc/nginx/sites-available/default (gestionado por Certbot, sirve otro dominio en producción).
#
# Instalación (docs/fases/FASE-05-despliegue.md §4):
#   sudo cp deploy/nginx-epimeteo.conf /etc/nginx/sites-available/epimeteo
#   sudo ln -s /etc/nginx/sites-available/epimeteo /etc/nginx/sites-enabled/epimeteo
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d epimeteo.waterressistan.duckdns.org
#
# Certbot reescribe este fichero al pedir el certificado: añade su propio bloque `listen 443 ssl`
# con las líneas `# managed by Certbot`. Es lo esperado, no se deshace a mano.

server {
    listen 80;
    listen [::]:80;
    server_name epimeteo.waterressistan.duckdns.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name epimeteo.waterressistan.duckdns.org;

    # certbot rellena aquí ssl_certificate / ssl_certificate_key / ssl_dhparam /
    # include options-ssl-nginx.conf al ejecutar el comando de arriba.

    # El WebSocket del juego. proxy_read_timeout largo a propósito: con el valor por defecto
    # (60s) nginx corta cualquier partida sin tráfico HTTP nuevo al minuto, y el juego mantiene
    # la conexión abierta con Ping/Pong a 1 Hz por dentro del WebSocket, no con peticiones HTTP
    # (docs/00 §5).
    location /ws {
        proxy_pass http://127.0.0.1:5100/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # La API HTTP: /version y /status. El propio servidor rechaza cualquier otra ruta en este
    # puerto (Program.cs), así que no hace falta restringir aquí también.
    location / {
        proxy_pass http://127.0.0.1:5101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
